<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101317"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ATHLETIQ"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>ATHLETIQ</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#101317;color:#f5f7f8}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 calc(90px + env(safe-area-inset-bottom))}main{max-width:640px;margin:auto;padding:22px 18px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px;letter-spacing:-1px;margin:6px 0}h2{font-size:20px;margin:24px 0 12px}h3{margin:0 0 10px;font-size:16px}.muted{color:#9aa6ac}.small{font-size:12px}.brand{color:#c9ff46;font-weight:800;letter-spacing:2px}.card{background:#1c2228;border:1px solid #30383d;border-radius:19px;padding:17px;margin:11px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}.metric{font-size:30px;font-weight:800;margin:8px 0 2px}.accent{color:#c9ff46}button{border:0;border-radius:12px;background:#c9ff46;color:#101317;padding:12px 16px;font-weight:750;cursor:pointer}button.secondary{background:#303a40;color:#f5f7f8}button.danger{background:#462b30;color:#ffc5c5}input,select,textarea{width:100%;background:#10171b;color:#fff;border:1px solid #465158;border-radius:11px;padding:12px;font:inherit;margin:5px 0 12px}label{font-size:13px;color:#cbd2d5}.tabs{position:fixed;bottom:0;left:0;right:0;background:#151a1fee;border-top:1px solid #30383d;display:flex;justify-content:space-around;padding:10px 4px calc(12px + env(safe-area-inset-bottom));z-index:3}.tabs button{background:none;color:#a6b0b5;padding:6px;font-size:11px;display:flex;flex-direction:column;gap:5px;align-items:center}.tabs button.active{color:#c9ff46}.tabs span{font-size:20px}.bar{height:9px;background:#394248;border-radius:9px;overflow:hidden}.bar>div{height:100%;background:#c9ff46;border-radius:9px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.entry{border-top:1px solid #343d43;padding:12px 0}.entry:first-child{border:0}.pill{display:inline-block;background:#303b3f;color:#c9ff46;border-radius:20px;padding:5px 9px;font-size:12px}.notice{background:#253126;border-radius:12px;padding:12px;color:#d3edbf;font-size:13px}.empty{color:#87939a;font-size:14px;padding:14px 0}details{margin-top:12px}summary{color:#c9ff46;cursor:pointer}svg{max-width:100%}button:focus-visible,input:focus-visible{outline:2px solid #c9ff46}
</style></head><body><main id="app"></main><nav class="tabs" id="tabs"></nav><script>
const KEY='athletiq-v1';const initial={profile:{weight:81.5,target:77,height:186,calories:2400,protein:160,water:2500},workouts:[],meals:[],sleep:[],weights:[],water:[],activities:[]};let state;try{state={...structuredClone(initial),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=structuredClone(initial)}let tab='home';const today=()=>new Date().toLocaleDateString('en-CA');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));render()};const sum=(arr,key,date=today())=>arr.filter(x=>x.date===date).reduce((a,x)=>a+(Number(x[key])||0),0);const fmt=n=>Number(n||0).toLocaleString('fr-FR',{maximumFractionDigits:1});const plans=[['Lundi — Jambes','Presse à cuisses','Leg curl','Leg extension','Mollets','Gainage'],['Mardi — Haut du corps','Développé couché','Tirage vertical','Développé épaules','Rowing','Curl biceps'],['Jeudi — Haut du corps','Développé incliné','Tractions ou tirage','Élévations latérales','Extension triceps','Abdominaux'],['Vendredi — Haut du corps léger','Rowing poulie','Écartés poulie','Face pull','Curl marteau','Gainage']];const card=(title,body)=>`<section class="card"><h3>${title}</h3>${body}</section>`;const list=(arr,fields)=>arr.length?arr.slice().reverse().slice(0,25).map(x=>`<div class="entry"><div class="row"><strong>${esc(x.name||x.type||x.date)}</strong><span class="muted small">${esc(x.date)}</span></div><div class="small muted">${fields(x)}</div></div>`).join(''):'<div class="empty">Aucune donnée enregistrée.</div>';const field=(label,name,type='number',extra='')=>`<label>${label}<input name="${name}" type="${type}" ${extra} required></label>`;function form(kind,fields,button='Enregistrer'){return `<form data-kind="${kind}">${fields}<button type="submit">${button}</button></form>`}function home(){let c=sum(state.meals,'calories'),p=sum(state.meals,'protein'),w=sum(state.water,'ml'),latest=state.weights.at(-1)?.kg??state.profile.weight,s=state.sleep.at(-1);return `<div class="brand">ATHLETIQ</div><h1>Ton tableau de bord</h1><p class="muted">${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})} · Train. Track. Evolve.</p><div class="grid">${card('Calories',`<div class="metric">${fmt(c)} <span class="small muted">/ ${fmt(state.profile.calories)}</span></div><div class="bar"><div style="width:${Math.min(100,c/state.profile.calories*100||0)}%"></div></div>`)}${card('Protéines',`<div class="metric">${fmt(p)} g</div><div class="muted small">Objectif ${state.profile.protein} g</div>`)}${card('Poids',`<div class="metric">${fmt(latest)} kg</div><div class="muted small">Cible ${state.profile.target} kg</div>`)}${card('Hydratation',`<div class="metric">${fmt(w)} ml</div><div class="bar"><div style="width:${Math.min(100,w/state.profile.water*100||0)}%"></div></div>`)}${card('Dernier sommeil',`<div class="metric">${s?fmt(s.hours)+' h':'—'}</div><div class="muted small">${s?esc(s.date):'Pas encore saisi'}</div>`)}${card('Séances',`<div class="metric">${state.workouts.length}</div><div class="muted small">Séances enregistrées</div>`)}</div>${card('Cette semaine',plans.map((x,i)=>`<div class="entry"><span class="pill">${x[0].split(' — ')[0]}</span> ${esc(x[0].split(' — ')[1])}</div>`).join('')+'<p class="small muted">Football mercredi et vendredi soir. Planning modifiable dans une future version.</p>')}<div class="notice">Tes données sont stockées localement sur cet iPhone. Exporte régulièrement une sauvegarde depuis Profil.</div>`}function sport(){return `<div class="brand">ATHLETIQ</div><h1>Sport</h1>${card('Nouvelle séance',form('workout',field('Nom de la séance','name','text','placeholder="Upper body"')+field('Durée (minutes)','minutes','number','min="1"')+field('Exercice principal','exercise','text')+field('Séries','sets','number','min="1"')+field('Répétitions','reps','number','min="1"')+field('Charge (kg)','kg','number','min="0" step="0.5"')))}${card('Activité cardio / football',form('activity',`<label>Type<select name="type"><option>Running</option><option>Football</option><option>Vélo</option><option>Marche</option><option>Autre</option></select></label>`+field('Durée (minutes)','minutes','number','min="1"')+field('Distance (km, 0 si non applicable)','km','number','min="0" step="0.01"')+field('Intensité ressentie /10','rpe','number','min="1" max="10"')))}${card('Programme 4 jours',plans.map(x=>`<details><summary>${esc(x[0])}</summary><p class="small muted">${x.slice(1).map(esc).join(' · ')}</p></details>`).join(''))}${card('Historique musculation',list(state.workouts,x=>`${esc(x.exercise)} · ${x.sets} × ${x.reps} · ${x.kg} kg · ${x.minutes} min`))}${card('Historique activités',list(state.activities,x=>`${x.minutes} min · ${x.km} km · RPE ${x.rpe}/10`))}`}
function nutrition(){let c=sum(state.meals,'calories'),p=sum(state.meals,'protein');return `<div class="brand">ATHLETIQ</div><h1>Nutrition</h1><div class="grid">${card('Calories',`<div class="metric">${fmt(c)}</div><div class="small muted">sur ${state.profile.calories} kcal</div>`)}${card('Protéines',`<div class="metric">${fmt(p)} g</div><div class="small muted">sur ${state.profile.protein} g</div>`)}</div>${card('Ajouter un repas',form('meal',field('Aliment / repas','name','text')+field('Calories (kcal)','calories','number','min="0"')+field('Protéines (g)','protein','number','min="0" step="0.1"')+field('Glucides (g)','carbs','number','min="0" step="0.1"')+field('Lipides (g)','fat','number','min="0" step="0.1"')))}${card('Ajouter de l’eau',`<div class="row"><button onclick="addWater(250)">+ 250 ml</button><button onclick="addWater(500)">+ 500 ml</button></div><p class="muted small">Aujourd’hui : ${sum(state.water,'ml')} / ${state.profile.water} ml</p>`)}${card('Repas récents',list(state.meals,x=>`${x.calories} kcal · P ${x.protein} g · G ${x.carbs} g · L ${x.fat} g`))}`}
function health(){return `<div class="brand">ATHLETIQ</div><h1>Santé & sommeil</h1>${card('Enregistrer une nuit',form('sleep',field('Date du réveil','date','date',`value="${today()}"`)+field('Sommeil (heures)','hours','number','min="0" max="24" step="0.1"')+field('Qualité ressentie /10','quality','number','min="1" max="10"')+field('Fatigue /10','fatigue','number','min="1" max="10"')))}${card('Enregistrer le poids',form('weight',field('Poids (kg)','kg','number','min="20" max="400" step="0.1"')))}${card('Historique du sommeil',list(state.sleep,x=>`${x.hours} h · Qualité ${x.quality}/10 · Fatigue ${x.fatigue}/10`))}${card('Historique du poids',list(state.weights,x=>`${x.kg} kg`))}<p class="muted small">Ces données sont déclaratives. Aucun score médical ni phase de sommeil n'est inventé.</p>`}
function progress(){const total=state.workouts.reduce((a,x)=>a+x.sets*x.reps*x.kg,0),km=state.activities.reduce((a,x)=>a+Number(x.km),0);return `<div class="brand">ATHLETIQ</div><h1>Progression</h1><div class="grid">${card('Séances',`<div class="metric">${state.workouts.length}</div>`)}${card('Distance',`<div class="metric">${fmt(km)} km</div>`)}${card('Volume soulevé',`<div class="metric">${fmt(total)} kg</div>`)}${card('Nuits suivies',`<div class="metric">${state.sleep.length}</div>`)}</div>${card('Évolution du poids',chart(state.weights.map(x=>Number(x.kg)))+`<p class="small muted">${state.weights.length} mesures enregistrées</p>`)}${card('Calories — 7 derniers jours',chart(Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return sum(state.meals,'calories',d.toLocaleDateString('en-CA'))})))}${card('Journal récent',list([...state.workouts.map(x=>({...x,type:'Musculation'})),...state.activities].sort((a,b)=>a.date.localeCompare(b.date)),x=>`${x.minutes} min`))}`}
function chart(vals){if(!vals.length)return '<div class="empty">Ajoute des données pour voir ton graphique.</div>';let min=Math.min(...vals),max=Math.max(...vals),r=max-min||1,pts=vals.map((v,i)=>`${15+(i/Math.max(1,vals.length-1))*290},${115-((v-min)/r)*90}`).join(' ');return `<svg viewBox="0 0 320 140" role="img" aria-label="Graphique de progression"><path d="M15 115H305" stroke="#465158"/><polyline points="${pts}" fill="none" stroke="#c9ff46" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${vals.map((v,i)=>`<circle cx="${15+(i/Math.max(1,vals.length-1))*290}" cy="${115-((v-min)/r)*90}" r="3" fill="#c9ff46"/>`).join('')}</svg>`}
function profile(){let p=state.profile;return `<div class="brand">ATHLETIQ</div><h1>Profil & données</h1>${card('Mes objectifs',form('profile',field('Poids de référence (kg)','weight','number',`step="0.1" value="${p.weight}"`)+field('Poids cible (kg)','target','number',`step="0.1" value="${p.target}"`)+field('Taille (cm)','height','number',`value="${p.height}"`)+field('Objectif calories / jour','calories','number',`min="1" value="${p.calories}"`)+field('Objectif protéines (g)','protein','number',`min="1" value="${p.protein}"`)+field('Objectif eau (ml)','water','number',`min="1" value="${p.water}"`),'Sauvegarder les objectifs'))}${card('Sauvegarde',`<p class="small muted">Export JSON : conserve une copie de tes données. Import : restaure une sauvegarde ATHLETIQ.</p><button onclick="exportData()">Exporter mes données</button><label style="display:block;margin-top:15px">Importer une sauvegarde<input type="file" accept="application/json,.json" id="restore"></label>`)}${card('Confidentialité',`<p class="small muted">Aucun compte, aucun serveur et aucune transmission de données. Les informations restent dans le stockage de cette installation. Une suppression des données du navigateur peut les effacer.</p><button class="danger" onclick="resetData()">Effacer toutes mes données</button>`)}`}
const tabs=[['home','⌂','Accueil'],['sport','▣','Sport'],['nutrition','◉','Nutrition'],['health','♡','Santé'],['progress','▥','Progrès'],['profile','⚙','Profil']];function render(){document.getElementById('app').innerHTML=({home,sport,nutrition,health,progress,profile}[tab])();document.getElementById('tabs').innerHTML=tabs.map(([id,icon,label])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')"><span>${icon}</span>${label}</button>`).join('');document.querySelectorAll('form[data-kind]').forEach(f=>f.addEventListener('submit',submit));let file=document.getElementById('restore');if(file)file.addEventListener('change',importData)}function go(x){tab=x;render();window.scrollTo(0,0)}function submit(e){e.preventDefault();let f=e.currentTarget,kind=f.dataset.kind,raw=Object.fromEntries(new FormData(f));for(let k in raw)if(!['name','exercise','type','date'].includes(k))raw[k]=Number(raw[k]);if(kind==='profile'){state.profile=raw}else{let mapping={workout:'workouts',activity:'activities',meal:'meals',sleep:'sleep',weight:'weights'};state[mapping[kind]].push({...raw,date:raw.date||today(),id:Date.now()})}save()}function addWater(ml){state.water.push({ml,date:today(),id:Date.now()});save()}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='athletiq-sauvegarde-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(e){let f=e.target.files?.[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!v.profile||!Array.isArray(v.workouts)||!Array.isArray(v.meals)||!Array.isArray(v.sleep)||!Array.isArray(v.weights)||!Array.isArray(v.water)||!Array.isArray(v.activities))throw Error('Format incorrect');if(confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')){state=v;save()}}catch{alert('Sauvegarde invalide.')}}function resetData(){if(confirm('Effacer définitivement toutes les données locales ?')){state=structuredClone(initial);save()}}render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
